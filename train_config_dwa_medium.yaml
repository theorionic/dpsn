# DWA Medium Config (~120M params)
dwa:
  model_type: dwa
  config: medium
  dataset: "roneneldan/TinyStories"
  text_column: "text"

training:
  max_steps: 100000
  batch_size: 32
  bf16: true
  log_interval: 100
  save_interval: 5000

data:
  tokenizer: "EleutherAI/gpt-neo-125m"
  chunk_size: 10000
  num_workers: 4

validation:
  interval: 5000
  steps: 100

infra:
  checkpoint_dir: "checkpoints/dwa_medium"
  resume: false
